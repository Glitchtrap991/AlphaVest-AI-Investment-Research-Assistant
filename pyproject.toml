[project]
name = "alphavest-research-assistant"
version = "0.1.0"
description = "AI Investment & Financial Research Assistant — single LangGraph agent with Streamlit UI"
readme = "README.md"
authors = [
    { name = "Glitchtrap991", email = "vaparajith.2024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.14",
    "langchain-community>=0.3.14",
    "langchain-google-community[gmail]>=2.0.0",
    "langchain-groq>=0.3.2",
    "langgraph>=0.4.1",
    "chromadb>=1.0.0",
    "streamlit>=1.45.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "duckduckgo-search>=7.5.0",
    "wikipedia>=1.4.0",
    "pypdf>=5.0.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "ddgs>=9.14.4",
    "langgraph-checkpoint>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
